<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Favicon e íconos -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- PWA -->
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0f0f11">
<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TecnoFicha">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TecnoFicha — Historial de Reparaciones</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/pwa.css">
<style>
  .field-error {
    display: block;
    margin-top: 4px;
    font-size: 0.78rem;
    color: #e03e3e;
    min-height: 1em;
  }
  #f-nombre[aria-invalid="true"],
  #f-ciudad[aria-invalid="true"],
  #f-provincia[aria-invalid="true"],
  #f-marca[aria-invalid="true"],
  #f-modelo[aria-invalid="true"],
  #f-cpu[aria-invalid="true"],
  #f-gpu[aria-invalid="true"],
  #f-ram[aria-invalid="true"],
  #f-discos[aria-invalid="true"],
  #f-problema[aria-invalid="true"],
  #f-tareas[aria-invalid="true"],
  #f-cobrado[aria-invalid="true"] {
    border-color: #e03e3e;
    outline-color: #e03e3e;
    box-shadow: 0 0 0 2px rgba(224, 62, 62, 0.15);
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">
      <span>🔧</span> TecnoFicha
    </div>
    <div class="topbar-actions">
      <button type="button" id="install-btn" class="install-btn" hidden>⬇ Instalar</button>
      <div class="topbar-count" id="topbar-count"></div>
    </div>
  </div>

  <div class="content">

    <!-- LIST PAGE -->
    <div class="page active" id="page-list">
      <div class="search-area">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" id="search-input" placeholder="Buscar cliente, ciudad..." oninput="renderList()" autocomplete="off">
        </div>
        <select class="prov-select" id="filter-prov" onchange="renderList()">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="list-meta" id="list-meta"></div>
      <div class="list-inner" id="list-container"></div>
    </div>

    <!-- FORM PAGE -->
    <div class="page" id="page-new">
      <div class="form-wrap">
        <div class="form-section">
          <div class="form-section-title">👤 Cliente</div>
          <div class="field">
            <label>Nombre completo <span class="req">*</span></label>
            <input id="f-nombre" placeholder="Juan Pérez" autocomplete="off"
                   maxlength="80" aria-describedby="f-nombre-error">
            <span id="f-nombre-error" class="field-error" role="alert" style="display:none"></span>
          </div>
          <div class="field">
            <label>Teléfono</label>
            <input id="f-tel" type="tel" placeholder="+54 11 1234-5678" autocomplete="off" aria-describedby="f-tel-error">
            <span id="f-tel-error" class="field-error" role="alert" style="display:none"></span>
          </div>
          <div class="field row2">
            <div>
              <label>Ciudad <span class="req">*</span></label>
              <input id="f-ciudad" placeholder="Buenos Aires" autocomplete="off"
                     maxlength="80" aria-describedby="f-ciudad-error">
              <span id="f-ciudad-error" class="field-error" role="alert" style="display:none"></span>
            </div>
            <div>
              <label>Provincia <span class="req">*</span></label>
              <input id="f-provincia" placeholder="CABA" list="prov-list" autocomplete="off"
                     maxlength="60" aria-describedby="f-provincia-error">
              <span id="f-provincia-error" class="field-error" role="alert" style="display:none"></span>
              <datalist id="prov-list">
                <option>Buenos Aires</option><option>CABA</option><option>Catamarca</option>
                <option>Chaco</option><option>Chubut</option><option>Córdoba</option>
                <option>Corrientes</option><option>Entre Ríos</option><option>Formosa</option>
                <option>Jujuy</option><option>La Pampa</option><option>La Rioja</option>
                <option>Mendoza</option><option>Misiones</option><option>Neuquén</option>
                <option>Río Negro</option><option>Salta</option><option>San Juan</option>
                <option>San Luis</option><option>Santa Cruz</option><option>Santa Fe</option>
                <option>Santiago del Estero</option><option>Tierra del Fuego</option><option>Tucumán</option>
              </datalist>
            </div>
          </div>
          <div class="field">
            <label>Fecha de consulta <span class="req">*</span></label>
            <input id="f-fecha" type="date" aria-describedby="f-fecha-error">
            <span id="f-fecha-error" class="field-error" role="alert" style="display:none"></span>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">💻 Equipo</div>
          <div class="field row2">
            <div>
              <label>Marca <span class="req">*</span></label>
              <input id="f-marca" placeholder="HP, Dell, Lenovo…" autocomplete="off"
                     maxlength="50" aria-describedby="f-marca-error">
              <span id="f-marca-error" class="field-error" role="alert" style="display:none"></span>
            </div>
            <div>
              <label>Modelo</label>
              <input id="f-modelo" placeholder="Pavilion 15" autocomplete="off"
                     maxlength="80" aria-describedby="f-modelo-error">
              <span id="f-modelo-error" class="field-error" role="alert" style="display:none"></span>
            </div>
          </div>
          <div class="field row2">
            <div>
              <label>CPU</label>
              <input id="f-cpu" placeholder="i5-1135G7" autocomplete="off"
                     maxlength="80" aria-describedby="f-cpu-error">
              <span id="f-cpu-error" class="field-error" role="alert" style="display:none"></span>
            </div>
            <div>
              <label>GPU</label>
              <input id="f-gpu" placeholder="MX450 / Integrada" autocomplete="off"
                     maxlength="80" aria-describedby="f-gpu-error">
              <span id="f-gpu-error" class="field-error" role="alert" style="display:none"></span>
            </div>
          </div>
          <div class="field row2">
            <div>
              <label>RAM (GB)</label>
              <input id="f-ram" type="number" placeholder="8" min="0" autocomplete="off" aria-describedby="f-ram-error">
              <span id="f-ram-error" class="field-error" role="alert" style="display:none"></span>
            </div>
            <div>
              <label>Almacenamiento</label>
              <input id="f-discos" placeholder="256GB SSD + 1TB" autocomplete="off" aria-describedby="f-discos-error" maxlength="100">
              <span id="f-discos-error" class="field-error" role="alert" style="display:none"></span>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">🛠️ Diagnóstico</div>
          <div class="field">
            <label>Problema con el que ingresa <span class="req">*</span></label>
            <textarea id="f-problema" maxlength="1000"
                      aria-describedby="f-problema-error"
                      placeholder="Describí el problema reportado por el cliente…"></textarea>
            <span id="f-problema-error" class="field-error" role="alert" style="display:none"></span>
          </div>
          <div class="field">
            <label>Tareas realizadas</label>
            <textarea id="f-tareas" maxlength="1000"
                      aria-describedby="f-tareas-error"
                      placeholder="Describí los trabajos realizados…"></textarea>
            <span id="f-tareas-error" class="field-error" role="alert" style="display:none"></span>
          </div>
          <div class="field">
            <label>Cobrado (ARS)</label>
            <input id="f-cobrado" type="number" placeholder="0" min="0" step="0.01"
                   autocomplete="off" aria-describedby="f-cobrado-error">
            <span id="f-cobrado-error" class="field-error" role="alert" style="display:none"></span>
          </div>
        </div>

        <button class="btn btn-primary" onclick="saveRepair()" id="save-btn">Guardar reparación</button>
        <button class="btn btn-danger" id="delete-btn" style="display:none" onclick="deleteRepair()">Eliminar este registro</button>
        <div style="height:4px"></div>
      </div>
    </div>

    <!-- DETAIL PAGE -->
    <div class="page" id="page-detail">
      <div class="detail-wrap" id="detail-container"></div>
    </div>

    <!-- STATS PAGE -->
    <div class="page" id="page-stats">
      <div class="stats-wrap" id="stats-container"></div>
    </div>

  </div><!-- /content -->

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="showPage('list')" id="nav-list">
      <span class="nav-icon">📋</span>Trabajos
    </button>
    <button class="nav-btn" onclick="showPage('new')" id="nav-new">
      <span class="nav-icon">➕</span>Nuevo
    </button>
    <button class="nav-btn" onclick="showPage('stats')" id="nav-stats">
      <span class="nav-icon">📊</span>Resumen
    </button>
  </nav>
</div>

<!-- Instrucciones de instalación para iOS/Safari -->
<dialog id="ios-install-dialog" class="pwa-dialog">
  <h2>Instalar TecnoFicha</h2>
  <ol>
    <li>Tocá el botón <strong>Compartir</strong> <span aria-hidden="true">⬆️</span> de Safari.</li>
    <li>Elegí <strong>Agregar a pantalla de inicio</strong>.</li>
    <li>Confirmá con <strong>Agregar</strong>.</li>
  </ol>
  <button type="button" class="btn btn-primary" id="ios-install-close">Entendido</button>
</dialog>

<!-- Aviso de nueva versión -->
<div id="update-banner" class="update-banner" role="status" hidden>
  <span>Hay una nueva versión disponible.</span>
  <button type="button" id="update-btn">Actualizar</button>
</div>

<div id="toast"></div>

<script type="module" src="script.js"></script>
</body>
</html>
